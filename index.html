<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Tính Cá Nhân</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chèn thêm Font chữ từ Google Fonts cho đẹp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện -->
        <div class="profile-header">
            <img src="https://via.placeholder.com/110" alt="Avatar" class="avatar">
            <h1>Lyis</h1>
            <p class="tagline">Gamer / Developer / Designer</p>
        </div>

        <!-- Đoạn giới thiệu ngắn -->
        <p class="bio">
            Một đoạn mô tả ngắn về bản thân bạn, những thứ bạn đang theo đuổi, sở thích cá nhân hoặc triết lý sống mà bạn tâm đắc. Keep it short and deep.
        </p>

        <!-- Các nút liên kết (Social Links) -->
        <div class="links-group">
            <a href="https://github.com/username" target="_blank" class="link-card">
                <span>GitHub</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://facebook.com/username" target="_blank" class="link-card">
                <span>Facebook</span>
                <span class="arrow">→</span>
            </a>
            <a href="mailto:your-email@gmail.com" class="link-card">
                <span>Email Liên Hệ</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Phần chân trang (Footer) -->
        <footer class="footer">
            <p>© 2026 Crafted by Yours</p>
        </footer>
    </div>

</body>
</html>
